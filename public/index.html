<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DSA Expert - Your AI-powered Data Structures & Algorithms learning companion">
    <title>DSA Expert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">HISTORY</span>
            <button class="new-chat-btn" id="newChatBtn" title="New Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>
        <div class="sidebar-chats" id="sidebarChats">
            <!-- Chat history items will be added here dynamically -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header Bar -->
        <header class="top-bar">
            <button class="menu-toggle" id="menuToggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="app-title">DSA EXPERT</h1>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <!-- Welcome Screen (shown when no messages) -->
            <div class="welcome-screen" id="welcomeScreen">
                <h2 class="welcome-title">DATA STRUCTURES & ALGORITHMS</h2>
                <p class="welcome-subtitle">Your AI-powered DSA learning companion</p>

                <div class="topic-grid">
                    <button class="topic-card" data-query="Explain common array patterns">
                        <h3>Arrays & Strings</h3>
                        <p>Explain common array patterns</p>
                    </button>
                    <button class="topic-card" data-query="Explain tree traversal techniques">
                        <h3>Binary Trees</h3>
                        <p>Tree traversal techniques</p>
                    </button>
                    <button class="topic-card" data-query="Explain DP problem-solving approach">
                        <h3>Dynamic Programming</h3>
                        <p>DP problem-solving approach</p>
                    </button>
                    <button class="topic-card" data-query="Explain BFS, DFS, and shortest path algorithms">
                        <h3>Graph Algorithms</h3>
                        <p>BFS, DFS, and shortest path</p>
                    </button>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="messages-area" id="messagesArea"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="chatInput"
                    placeholder="Ask about data structures, algorithms, or code..."
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
